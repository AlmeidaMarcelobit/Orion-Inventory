<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 130" role="img" aria-labelledby="title desc"><title id="title">Fluxo dos termos</title><desc id="desc">Selecionar colaborador, conferir os itens, gerar entrega ou devolução e enviar o termo assinado.</desc><rect width="900" height="130" rx="18" fill="#fff7fb"/><g fill="#fff" stroke="#ffd0e6"><rect x="20" y="25" width="180" height="80" rx="12"/><rect x="245" y="25" width="180" height="80" rx="12"/><rect x="470" y="25" width="180" height="80" rx="12"/><rect x="695" y="25" width="185" height="80" rx="12"/></g><g stroke="#ff0077" fill="none" stroke-width="2"><path d="M210 65h25m-7-7 7 7-7 7M435 65h25m-7-7 7 7-7 7M660 65h25m-7-7 7 7-7 7"/></g><g font-family="Arial,sans-serif" text-anchor="middle"><g fill="#ff0077" font-size="13" font-weight="bold"><text x="110" y="49">01 · Colaborador</text><text x="335" y="49">02 · Ficha dos itens</text><text x="560" y="49">03 · Gerar termo</text><text x="787" y="49">04 · Enviar assinado</text></g><g fill="#525965" font-size="12"><text x="110" y="76">Busque pelo nome</text><text x="335" y="76">Confira os equipamentos</text><text x="560" y="76">Entrega ou devolução</text><text x="787" y="76">Arraste ou selecione</text></g></g></svg>
