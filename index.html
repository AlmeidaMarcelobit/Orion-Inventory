<!doctype html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8" />
        <meta author="Marcelo Almeida" />
        <title>Sistema Gestão Login</title>
        <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" />
        <link rel="icon" type="image/x-icon" href="assets/img/global/favicon/android-chrome-512x512.png" />
        <link rel="stylesheet" href="assets/css/pages/login/login.css" />
    </head>

    <body>
        <main class="container">
            <form>
               <img src="img/pages/login/orion-title" alt="">
                <div class="input-box">
                    <input type="email" placeholder="Usuário" />
                    <i class="bx bxs-user"></i>
                </div>

                <div class="input-box">
                    <input type="password" placeholder="Senha" />
                    <i class="bx bxs-lock-alt"></i>
                </div>
                <div class="remember-forgot">
                    <label> <input type="checkbox" />Lembrar minha senha </label>
                    <a href="#">Esqueci minha senha </a>
                </div>

                <button type="submit" class="login">Entrar</button>
            </form>
        </main>
    </body>
</html>
