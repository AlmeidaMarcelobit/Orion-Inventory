<!doctype html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8" />
        <meta author="Marcelo Almeida" />
        <title>Sistema Gestão Login</title>
        <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" />
        <link rel="icon" type="image/x-icon" href="img/favicon/web-app-manifest-512x512.png" />
        <link rel="stylesheet" href="css/home/login.css">
    </head>

    <body>
        <main class="container">
            <form>
                <h1>Login Gestão</h1>
                <div class="input-box">
                    <input type="email" placeholder="Usuário" />
                    <i class="bx bxs-user"></i>
                </div>

                <div class="input-box">
                    <input type="password" placeholder="Senha" />
                    <i class="bx bxs-lock-alt"></i>
                </div>
                <div class="remember-forgot">
                    <label>
                        <input type="checkbox" />Lembrar minha senha
                    </label>
                    <a href="#">Esqueci minha senha </a>
                </div>

                <button type="submit">Entrar</button>
                
               
            </form>
            <p>Acesso seguro : Somente pessoal autorizado <img src="img/icon/Employee-Profile-Streamline-Stickies.png" alt="" width="12px"></p>
            <p></p>
        </main>
    </body>
</html>
